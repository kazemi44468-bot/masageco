name: Sync local Persian fonts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved fonts
        run: |
          set -e
          mkdir -p assets/fonts
          curl -fsSL https://raw.githubusercontent.com/kazemi44468-bot/files/main/fonts/BYekan.woff -o assets/fonts/BYekan.woff
          curl -fsSL https://raw.githubusercontent.com/kazemi44468-bot/files/main/fonts/Vazir-Bold.woff -o assets/fonts/Vazir-Bold.woff
      - name: Commit synchronized fonts
        run: |
          if git diff --quiet -- assets/fonts; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fonts/BYekan.woff assets/fonts/Vazir-Bold.woff
          git commit -m 'افزودن فونت‌های فارسی محلی پروژه'
          git push
